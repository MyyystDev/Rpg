plugins {
    id 'java-library'
    id 'maven-publish'
}

// ---- Per-mod identity properties ----
// Each mod owns mods/<name>/gradle.properties (mod_id, mod_name, description,
// credits). This loads that file into every module of the mod, layered over
// the root gradle.properties which holds shared values.
def modPropsFile = project.parent != null
        ? new File(project.parent.projectDir, 'gradle.properties')
        : null
if (modPropsFile != null && modPropsFile.exists()) {
    def modProps = new Properties()
    modPropsFile.withInputStream { modProps.load(it) }
    modProps.each { k, v ->
        if (k == 'description') {
            project.description = v          // real Project field, not an ext prop
        } else {
            project.ext.set(k as String, v)
        }
    }
}

// Give every mod a unique module identity: same-named subprojects (common/
// fabric/neoforge) across mods would otherwise collide as group:name:version
// and Gradle substitutes one for the other (circular-dependency symptom).
if (project.ext.has('mod_id')) {
    project.group = "${project.group}.${project.ext.get('mod_id')}"
}

base {
    archivesName = "${mod_id}-${project.name}-${minecraft_version}"
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
    withJavadocJar()
}

// ... rest of the file exactly as you pasted it ...

tasks.withType(Jar).configureEach {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_name}" }
    }
}

jar {

    manifest {
        attributes([
                'Specification-Title'   : mod_name,
                'Specification-Vendor'  : mod_author,
                'Specification-Version' : project.jar.archiveVersion,
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : mod_author,
                'Built-On-Minecraft'    : minecraft_version
        ])
    }
}

processResources {
    var expandProps = [
            'version'                      : version,
            'group'                        : project.group, //Else we target the task's group.
            'minecraft_version'            : minecraft_version,
            'minecraft_version_range'      : minecraft_version_range,
            'fabric_version'               : fabric_version,
            'fabric_loader_version'        : fabric_loader_version,
            'mod_name'                     : mod_name,
            'mod_author'                   : mod_author,
            'mod_id'                       : mod_id,
            'license'                      : license,
            'description'                  : project.description,
            'neoforge_version'             : neoforge_version,
            'neoforge_loader_version_range': neoforge_loader_version_range,
            'credits'                      : credits,
            'java_version'                 : java_version
    ]

    var jsonExpandProps = expandProps.collectEntries {
        key, value -> [(key): value instanceof String ? value.replace('\n', '\\\\n') : value]
    }

    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) {
        expand expandProps
    }

    filesMatching(['pack.mcmeta', 'fabric.mod.json', '*.mixins.json']) {
        expand jsonExpandProps
    }

    inputs.properties(expandProps)
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url System.getenv('local_maven_url')
        }
    }
}
